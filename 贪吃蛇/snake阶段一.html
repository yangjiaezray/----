<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贪吃蛇 · 阶段一（手动模式）</title>
<style>
  /* ===== 页面整体样式 ===== */
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    background:#0f1115;color:#e6e6e6;
    font-family:"Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;
  }
  h1{font-size:20px;margin:0 0 14px;letter-spacing:1px}

  /* ===== 主体布局：左边棋盘，右边信息面板 ===== */
  .wrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  canvas{background:#0b0d12;border:1px solid #2a2f3a;border-radius:8px;display:block}

  .panel{
    width:220px;background:#171a21;border:1px solid #2a2f3a;
    border-radius:8px;padding:16px;
  }
  .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}
  .row .val{color:#4ade80;font-weight:bold}

  button{
    width:100%;padding:9px;margin-bottom:8px;cursor:pointer;
    background:#2a2f3a;color:#e6e6e6;border:1px solid #3a4050;border-radius:6px;font-size:14px;
  }
  button:hover{background:#343a48}

  .tip{font-size:12px;color:#8b93a7;line-height:1.9;margin-top:10px}
  .tip b{color:#e6e6e6}

  /* ===== 覆盖在棋盘上的“游戏结束”遮罩 ===== */
  .board{position:relative}
  .mask{
    position:absolute;inset:0;display:none;
    background:rgba(10,12,16,.82);border-radius:8px;
    flex-direction:column;align-items:center;justify-content:center;
  }
  .mask.show{display:flex}
  .mask .big{font-size:22px;font-weight:bold;color:#f87171;margin-bottom:6px}
  .mask .small{font-size:13px;color:#9aa3b5}
</style>
</head>
<body>

<h1>🐍 贪吃蛇 · 阶段一（手动模式）</h1>

<div class="wrap">
  <!-- 棋盘区域：canvas 画格子，mask 是结束遮罩 -->
  <div class="board">
    <canvas id="cv" width="400" height="400"></canvas>
    <div class="mask" id="mask">
      <div class="big" id="maskTitle">游戏结束</div>
      <div class="small" id="maskText">点击“重新开始”再来一局</div>
    </div>
  </div>

  <!-- 信息面板 -->
  <div class="panel">
    <div class="row"><span>当前分数</span><span class="val" id="score">0</span></div>
    <div class="row"><span>已吃食物</span><span class="val" id="eaten">0</span></div>
    <div class="row"><span>蛇身长度</span><span class="val" id="len">3</span></div>
    <div class="row"><span>最高分</span><span class="val" id="best">0</span></div>
    <div class="row"><span>状态</span><span class="val" id="state">待开始</span></div>

    <hr style="border:none;border-top:1px solid #2a2f3a;margin:14px 0">

    <button id="btnStart">开始 / 暂停</button>
    <button id="btnReset">重新开始</button>

    <div class="tip">
      <div>🎮 <b>方向键</b> 或 <b>WASD</b> 控制方向</div>
      <div>⏸ <b>空格</b> 开始 / 暂停</div>
      <div>❌ <b>撞墙</b> 或 <b>撞到自己</b> 即结束</div>
      <div>🍎 吃一个食物 <b>+10 分</b>，蛇身变长 1 节</div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   贪吃蛇 阶段一：单人手动模式
   —— 纯 HTML + CSS + JavaScript，不依赖任何外部库
   ========================================================================== */

/* ---------- 1. 基础常量 ---------- */
const COLS = 20;          // 棋盘列数
const ROWS = 20;          // 棋盘行数
const CELL = 20;          // 每个格子 20 像素

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $   = id => document.getElementById(id);

/* ---------- 2. 颜色主题 ---------- */
const COLOR = {
  bg:    '#0b0d12',   // 棋盘底色
  grid:  '#13161d',   // 网格线
  snake: '#4ade80',   // 蛇身
  head:  '#22c55e',   // 蛇头
  food:  '#f87171'    // 食物
};

/* ---------- 3. 游戏状态变量 ---------- */
let snake    = [];   // 蛇身数组，snake[0] 是蛇头
let dir      = {};   // 当前前进方向
let nextDir  = {};   // 玩家按下的“下一步方向”（缓冲，防止快速按键丢失）
let food     = {};   // 食物坐标
let score    = 0;    // 当前分数
let eaten    = 0;    // 已吃食物数
let alive    = true; // 是否还活着
let running  = false;// 是否在运行（false = 暂停/未开始）
let timer    = null; // 定时器

// 最高分从浏览器本地存储读取，刷新页面也不会丢
let best = Number(localStorage.getItem('snake_best') || 0);

/* ---------- 4. 小工具函数 ---------- */
const key    = p => p.x + ',' + p.y;              // 坐标转字符串，方便放进 Set 去重
const eq     = (a, b) => a.x === b.x && a.y === b.y;  // 判断两个坐标是否相同
const inside = p => p.x >= 0 && p.x < COLS && p.y >= 0 && p.y < ROWS; // 是否在棋盘内

/* ---------- 5. 随机生成食物 ---------- */
// 做法：把棋盘所有空格列出来，再随机挑一个，保证食物不会生成在蛇身上
function makeFood() {
  const occupied = new Set(snake.map(key));  // 蛇身占用的格子
  const free = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (!occupied.has(x + ',' + y)) free.push({ x, y });
    }
  }
  if (free.length === 0) return null;        // 棋盘被填满，没有空格了
  return free[Math.floor(Math.random() * free.length)];
}

/* ---------- 6. 初始化 / 重置一局 ---------- */
function reset() {
  // 初始蛇：3 节，位于第 10 行，头朝右
  snake   = [ {x:10,y:10}, {x:9,y:10}, {x:8,y:10} ];
  dir     = { x:1, y:0 };   // 当前方向：向右
  nextDir = { x:1, y:0 };   // 下一步方向：向右
  food    = makeFood();
  score   = 0;
  eaten   = 0;
  alive   = true;
  running = false;
  stop();
  $('mask').classList.remove('show');
  updateHUD();
  draw();
  setState('待开始');
}

/* ---------- 7. 画棋盘 ---------- */
function draw() {
  // 7.1 铺底色
  ctx.fillStyle = COLOR.bg;
  ctx.fillRect(0, 0, cv.width, cv.height);

  // 7.2 画网格线
  ctx.strokeStyle = COLOR.grid;
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, cv.height); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(cv.width, i*CELL); ctx.stroke();
  }

  // 7.3 画食物（红色圆点）
  if (food) {
    ctx.fillStyle = COLOR.food;
    ctx.beginPath();
    ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 3, 0, Math.PI*2);
    ctx.fill();
  }

  // 7.4 画蛇：第 0 节是头，用更亮的颜色区分
  snake.forEach((s, i) => {
    ctx.fillStyle = (i === 0) ? COLOR.head : COLOR.snake;
    ctx.fillRect(s.x*CELL + 1, s.y*CELL + 1, CELL - 2, CELL - 2);
  });
}

/* ---------- 8. 走一步（核心逻辑） ---------- */
function step() {
  dir = nextDir;   // 采用玩家缓冲的方向

  // 8.1 算出新蛇头位置
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 8.2 判定一：撞墙
  if (!inside(head)) return gameOver('撞到墙了');

  // 8.3 判定二：撞到自己
  //     注意这里用 slice(0, -1) 去掉最后一节（蛇尾），
  //     因为蛇移动时尾巴会同步让开，进入“尾巴原来的位置”是安全的
  const body = snake.slice(0, -1);
  if (body.some(s => eq(s, head))) return gameOver('撞到自己了');

  // 8.4 把新蛇头插到数组最前面
  snake.unshift(head);

  // 8.5 判断是否吃到食物
  if (eq(head, food)) {
    score += 10;               // 加分
    eaten += 1;                // 计数
    if (score > best) {        // 刷新最高分并保存到本地
      best = score;
      localStorage.setItem('snake_best', best);
    }
    food = makeFood();         // 重新生成一个食物
    if (food === null) {       // 没有空格了 = 棋盘被填满 = 通关
      stop();
      $('maskTitle').textContent = '🎉 通关！';
      $('maskText').textContent  = '棋盘已被你填满，最终分数 ' + score;
      $('mask').classList.add('show');
      setState('通关');
      updateHUD();
      return;
    }
    // 吃到食物时不删除蛇尾 → 蛇变长 1 节
  } else {
    snake.pop();               // 没吃到 → 删除蛇尾 → 长度不变，看起来像在前进
  }

  updateHUD();
  draw();
}

/* ---------- 9. 游戏结束 ---------- */
function gameOver(reason) {
  alive = false;
  stop();
  $('maskTitle').textContent = '游戏结束';
  $('maskText').textContent  = reason + '　|　最终分数 ' + score + '　|　吃了 ' + eaten + ' 个';
  $('mask').classList.add('show');
  setState('已结束');
  updateHUD();
}

/* ---------- 10. 开始 / 停止 ---------- */
function start() {
  if (running || !alive) return;
  running = true;
  timer = setInterval(step, 120);  // 每 120 毫秒走一步，数字越小越快
  setState('游戏中');
}
function stop() {
  running = false;
  clearInterval(timer);
}

/* ---------- 11. 刷新右侧面板数字 ---------- */
function updateHUD() {
  $('score').textContent = score;
  $('eaten').textContent = eaten;
  $('len').textContent   = snake.length;
  $('best').textContent  = best;
}
function setState(s) { $('state').textContent = s; }

/* ---------- 12. 按钮事件 ---------- */
$('btnStart').onclick = () => {
  if (!alive) { reset(); start(); return; }   // 结束后按这个 = 重开一局
  if (running) { stop(); setState('已暂停'); }
  else         { start(); }
};
$('btnReset').onclick = () => { reset(); };

/* ---------- 13. 键盘事件 ---------- */
const KEYMAP = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
};

document.addEventListener('keydown', e => {
  // 13.1 空格：开始 / 暂停
  if (e.code === 'Space') {
    if (!alive) { reset(); start(); }
    else if (running) { stop(); setState('已暂停'); }
    else { start(); }
    e.preventDefault();
    return;
  }

  // 13.2 方向键 / WASD：改变方向
  const k = (e.key.length === 1) ? e.key.toLowerCase() : e.key;
  const nd = KEYMAP[k];
  if (!nd) return;

  // 禁止 180 度掉头：新方向不能正好是当前方向的反向
  //   （蛇头往回走等于撞自己的脖子）
  if (snake.length > 1 && nd.x === -dir.x && nd.y === -dir.y) return;

  nextDir = nd;   // 存进缓冲，等下一帧 step() 时生效
  e.preventDefault();
});

/* ---------- 14. 启动 ---------- */
reset();
</script>
</body>
</html>
